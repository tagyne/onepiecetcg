apiVersion: v1
kind: ServiceAccount
metadata:
  name: onepiecetcg-web
  namespace: onepiecetcg
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepiecetcg-web
  namespace: onepiecetcg
  labels:
    app.kubernetes.io/name: onepiecetcg-web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onepiecetcg-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onepiecetcg-web
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: onepiecetcg-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: web:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-web
              containerPort: 3001
              protocol: TCP
          env:
            - name: NITRO_HOST
              value: 0.0.0.0
            - name: NITRO_PORT
              value: "3001"
            - name: NUXT_PUBLIC_API_BASE
              value: https://api-optcg.tagyne.fr
            - name: NUXT_API_INTERNAL_BASE
              value: https://api-optcg.tagyne.fr
            - name: NUXT_PUBLIC_COLYSEUS_ENDPOINT
              value: wss://api-optcg.tagyne.fr
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /
              port: http-web
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http-web
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http-web
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: onepiecetcg-web
  namespace: onepiecetcg
  labels:
    app.kubernetes.io/name: onepiecetcg-web
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: onepiecetcg-web
  ports:
    - name: http-web
      port: 3001
      targetPort: http-web
      protocol: TCP
