apiVersion: v1
kind: ServiceAccount
metadata:
  name: onepiecetcg-api
  namespace: onepiecetcg
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepiecetcg-api
  namespace: onepiecetcg
  labels:
    app.kubernetes.io/name: onepiecetcg-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onepiecetcg-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onepiecetcg-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: onepiecetcg-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: api:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-api
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: api-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "3000"
            - name: WEB_ORIGIN
              value: https://optcg.tagyne.fr
            - name: BETTER_AUTH_URL
              value: https://api-optcg.tagyne.fr
            - name: SESSION_COOKIE_DOMAIN
              value: .tagyne.fr
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: SESSION_COOKIE_SAME_SITE
              value: lax
            - name: AUTH_ANONYMOUS_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cloudsql
              mountPath: /cloudsql
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: http-api
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http-api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http-api
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
          args:
            - "--structured-logs"
            - "--unix-socket=/cloudsql"
            - "decouverte-gke:europe-west9:onepiecetcg-postgres"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cloudsql
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: onepiecetcg-api
  namespace: onepiecetcg
  labels:
    app.kubernetes.io/name: onepiecetcg-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: onepiecetcg-api
  ports:
    - name: http-api
      port: 3000
      targetPort: http-api
      protocol: TCP
